name: Prepare demo build
description: Install JDK and publish the pinned engine snapshot used by the demo.
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        repository: canopyengine/canopy
        ref: d96056cbe9b15d432523e8d7d53bcd1c08534743
        path: .engine-source
        persist-credentials: false
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: |
          25
          17
    - uses: gradle/actions/setup-gradle@v6.3.0
    - name: Publish engine dependencies
      shell: bash
      working-directory: .engine-source
      run: |
        chmod +x gradlew
        ./gradlew publishToMavenLocal --no-daemon --stacktrace
    - name: Make demo wrapper executable
      shell: bash
      run: chmod +x engine/0.1.0/gradlew
