name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (CodeQL)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
      - name: Compile demo for CodeQL
        working-directory: engine/0.1.0
        run: ./gradlew classes --no-daemon --stacktrace --no-build-cache --rerun-tasks
      - uses: github/codeql-action/analyze@v4
